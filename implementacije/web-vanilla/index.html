<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bista kralja Tomislava — 3D viewer (vanilla three.js)</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #081209;
        color: #e8efe9;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      main {
        width: min(92vw, 720px);
        padding: 24px 0 48px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
      }
      #viewer {
        width: 100%;
        height: min(70vh, 560px);
        border-radius: 12px;
      }
      p.note {
        font-size: 13px;
        color: rgba(232, 239, 233, 0.6);
      }
    </style>
    <!-- three.js pinan na 0.169.0 (ista verzija kao referentna implementacija) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Bista kralja Tomislava — vanilla three.js viewer</h1>
      <div id="viewer"></div>
      <p class="note">
        Rotacija samo oko vertikalne osi · zoom kotačićem/pinchom · deep-link
        <code>?materijal=bronca|kamen|patina</code>
      </p>
    </main>
    <script type="module">
      import { createBistaViewer } from './bista-viewer.js';
      createBistaViewer(document.querySelector('#viewer'), {
        modelUrl: './tomislav-bista.glb',
      });
    </script>
  </body>
</html>
